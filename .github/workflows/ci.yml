name: Pull Request CI

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Test & Validate Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Python Compile Check
        run: |
          python -m compileall .

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit & Transport Tests
        env:
          GEMINI_MODEL: gemini-3.6-flash
          VOICE_TRANSPORT_DEFAULT: daily
          VOICE_TRANSPORT_FALLBACK: livekit
        run: |
          pytest -v

      - name: Verify Production Docker Image Build
        run: |
          docker build -t careervoice-pipecat:ci-test .
