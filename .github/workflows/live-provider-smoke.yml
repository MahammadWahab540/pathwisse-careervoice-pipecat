name: Live WebRTC Provider Provisioning Smoke Test

on:
  workflow_dispatch:

jobs:
  smoke_test:
    name: Execute Daily & LiveKit Provider Provisioning Smoke Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Provider Provisioning Smoke Test
        env:
          DAILY_API_KEY: ${{ secrets.DAILY_API_KEY }}
        run: |
          python scripts/smoke-daily.py

      - name: Run LiveKit Provider Provisioning Smoke Test
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
        run: |
          python scripts/smoke-livekit.py
